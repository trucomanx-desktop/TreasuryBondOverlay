[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treasury_bond_overlay"
version = "0.1.0"
description = "Displays selected Brazilian Treasury bond data on your desktop and refreshes it at a configurable interval."
readme = "README.md"
authors = [{name = "Fernando Pujaico Rivera", email = "fernando.pujaico.rivera@gmail.com"}]
maintainers = [{name = "Fernando Pujaico Rivera", email = "fernando.pujaico.rivera@gmail.com"}]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-only WITH Classpath-Exception-2.0 OR BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["brazil","economic","widget","indicator","desktop"]
dependencies = [
    "PyQt5",
    "brazilian_economic_data"
]

[project.urls]
"Bug Reports" = "https://github.com/trucomanx-desktop/TreasuryBondOverlay/issues"
"Funding" = "https://trucomanx.github.io/en/funding.html"
"Documentation" = "https://github.com/trucomanx-desktop/TreasuryBondOverlay/tree/main/doc"
"Source" = "https://github.com/trucomanx-desktop/TreasuryBondOverlay"

[project.scripts]
"treasury-bond-overlay" = "treasury_bond_overlay.program:main"

[tool.setuptools]
packages = ["treasury_bond_overlay", "treasury_bond_overlay.modules"]

[tool.setuptools.package-data]
"treasury_bond_overlay" = ["icons/*.png","icons/*.svg"]
